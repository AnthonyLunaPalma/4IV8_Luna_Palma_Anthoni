<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo de un cuestionario validado con Javascript</title>
    <link rel="stylesheet" href="./css/style.css">
    <link href="https://fonts.googleapis.com/css?family=Reboto:300,400,500,700&display=swap" rel="stylesheet">
</head>
<body>
    <form action="" method="post" id="form">
        <div class="form">
            <h1>Formulario</h1>
            <div class="grupo">
                <input type="text" name="" id="name"><span class="barra"></span>
                <label for="">Nombre</label>
            </div>
            <div class="grupo">
                <input type="number" name="" id="age"><span class="barra"></span>
                <label for="">Edad</label>
            </div>
            <div class="grupo">
                <input type="email" name="" id="email"><span class="barra"></span>
                <label for="">Email</label>
            </div>
            <button type="submit">Enviar</button>
            <p class="warnings" id="warnings"></p>
        </div>
    </form>
    <a href="../index.html" class="botonr">
                <button class="boton1"><b>Regresar</b></button>
    </a>
    <script src="./JS/main.js"></script>
</body>
</html>
